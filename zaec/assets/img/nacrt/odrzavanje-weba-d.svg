<svg class="d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMaxYMid slice" role="img" aria-labelledby="ntU10d ndU10d"><title id="ntU10d">Dnevnik održavanja web stranice: tjedni upisi provjera, osvijetljena ovotjedna provjera forme</title><desc id="ndU10d">Dnevnik održavanja nacrtan kao tablica: tjedni teku slijeva do ovog tjedna uz desni rub, a retci su provjere — provjera forme, ažuriranja s provjerom rada, sigurnosna kopija izvan servera, nadzor dostupnosti i brzina. Upisi su tintom: kvačice, kvadratići kopija i neprekinuta crta nadzora; kota pokazuje četiri tjedna između probnih upita. Stvaran i osvijetljen je samo ovotjedni upis provjere forme: probni upit je stigao. Toplo svjetlo je kontrolna lampica tog upisa.</desc>
