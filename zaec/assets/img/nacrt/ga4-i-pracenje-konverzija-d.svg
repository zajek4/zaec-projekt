<svg class="d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMaxYMid slice" role="img" aria-labelledby="ntU8d ndU8d"><title id="ntU8d">Jednopolna shema mjerenja: od klika i forme do konverzije u GA4</title><desc id="ndU8d">Shema nacrtana kao jednopolna električna shema. Gore su tri izvora: klik na poziv, poslana forma i kupnja, spojeni na sabirnicu dataLayer. Ispod je tag manager kao pretvarač, pa sklopka privole koju pokreće traka privole, zatim GA4 kao mjerni instrument. Iza njega se vod grana prema oglasima i izvještaju, a završava žaruljom konverzije s nazivom događaja generate_lead, osvijetljenom toplim svjetlom. Lijevo je ključ: stranica na mobitelu s tri mjesta na kojima nastaju izvori. Oznake povezuju tag manager, privolu i događaje s dijelovima usluge.</desc>
