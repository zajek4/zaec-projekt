<svg class="d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMaxYMid slice" role="img" aria-labelledby="ntU9d ndU9d"><title id="ntU9d">Filmska traka učitavanja mobilne stranice s pragom LCP od 2,5 sekunde</title><desc id="ndU9d">Kadrovi mobilne stranice dok se učitava, poredani na osi vremena u razmacima od pola sekunde. Prvi kadrovi su prazni jer se čeka server, u sljedećem je raspored bez teksta jer se čeka font, zatim tekst bez slike. U posljednjem kadru pojavljuje se najveći element, naslovna slika s bojlerom, uz natpis „Curi bojler?“, i on je osvijetljen toplim svjetlom. Okomita crta na 2,5 sekunde označava Googleov prag za dobar LCP. Oznake povezuju prazan kadar s hostingom i cacheom, skriveni tekst s fontovima i prazan okvir sa slikama.</desc>
