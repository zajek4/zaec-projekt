<svg class="d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMaxYMid slice" role="img" aria-labelledby="nt00d nd00d"><title id="nt00d">Pročelje zvonika konkatedrale sv. Petra i Pavla u Osijeku, mjerilo 1:500</title><desc id="nd00d">Tehnički crtež zvonika konkatedrale u Osijeku, visokog 90 m od tla do križa. Oznake povezuju dijelove zvonika s načinom rada studija: portal je prvi razgovor, kontrafori nacrt prije dizajna, a vrh jedna osoba koja odgovara za projekt. Sat je označen toplim svjetlom s radnim vremenom. U sastavnici su odgovorna osoba i sjedište studija.</desc>
