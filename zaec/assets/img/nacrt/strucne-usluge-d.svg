<svg class="d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMaxYMid slice" role="img" aria-labelledby="nt09d nd09d"><title id="nt09d">Ured na katu modernističke zgrade noću u osječkoj ulici</title><desc id="nd09d">Crtež pročelja modernističke katnice noću. Prizemlje obloženo kamenim pločama je tamno: ulaz u stubišnom tornju s nadstrešnicom i uz njega ploča sa zvoncima na kojoj svijetli samo pločica Ured. Na katu svijetli trakasti prozor ureda: police s registratorima, stol sa stolnom svjetiljkom i dvije stolice, uokvirena ovlaštenja i biljka. Legenda povezuje ploču s timom i ovlaštenjima, police s referencama, a stol s upitom prema opsegu. Stol u uredu označen je toplim svjetlom.</desc>
