<svg class="d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMaxYMid slice" role="img" aria-labelledby="nt06d nd06d"><title id="nt06d">Kuća s apartmanima noću u osječkoj ulici</title><desc id="nd06d">Crtež pročelja klasicističke jednokatnice noću. U prizemlju su osvijetljeni recepcija s pultom, zvoncem i pločom s ključevima, staklena ulazna vrata sa stubištem prema sobama i blagovaonica sa stolom, stolicama i švedskim stolom. Iznad recepcije je natpis Apartmani na tri jezika, na katu su tamni prozori soba s griljama, a lijevo kolni ulaz u dvorište. Legenda povezuje sobe sa smještajem i galerijom, recepciju s upitom i rezervacijom, a natpis s više jezika. Ploča s ključevima označena je toplim svjetlom.</desc>
