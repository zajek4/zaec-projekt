<svg class="d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMaxYMid slice" role="img" aria-labelledby="ntU2d ndU2d"><title id="ntU2d">Katalog webshopa nacrtan kao police trgovine, s jednim stvarnim proizvodom i paketom na putu</title><desc id="ndU2d">Police trgovine kao katalog webshopa: u pretincima su šalice, vaze, staklenke i zdjele nacrtane samo obrisom, a nazivi i cijene samo kao kostur. Jedan proizvod je stvaran i osvijetljen: kartica keramičke šalice s nazivom, odabirom boje i gumbom Dodaj u košaricu, na kojem je toplo svjetlo. Iz kartice vodi put narudžbe preko naplate do paketa s adresnicom koji odlazi preko desnog ruba. Oznake povezuju police s katalogom, naplatu s plaćanjem, paket s dostavom i točke na putu s GA4 e-commerce mjerenjem.</desc>
