<svg class="d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMaxYMid slice" role="img" aria-labelledby="nt07d nd07d"><title id="nt07d">Izlog trgovine noću u osječkoj ulici</title><desc id="nd07d">Crtež pročelja prizemne kuće sa zabatom prema ulici noću: široki izlog s policama punim robe u siluetama (staklenke, složeni tekstil, košare, kutije, stolna svjetiljka i boce) i jednim proizvodom na postolju pod reflektorom, staklena vrata s pločicom Zatvoreno i paketima spremnima za dostavu. Iznad izloga je natpis Trgovina. Legenda povezuje police s katalogom, postolje sa stranicom proizvoda, a pakete s dostavom i plaćanjem. Proizvod na postolju označen je toplim svjetlom.</desc>
