<svg class="d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMaxYMid slice" role="img" aria-labelledby="nt10d nd10d"><title id="nt10d">Ulaz ustanove noću u baroknoj zgradi</title><desc id="nd10d">Crtež pročelja barokne jednokatnice noću: visoki krov s krovnim prozorima, srednji rizalit s trokutnim zabatom i natpisom Ustanova u frizu. Osvijetljeno je predvorje: kroz lijevi prozor vidi se oglasna ploča s pribodenim listovima, kroz kameni portal s lukom fenjer i unutarnja staklena vrata, a kroz desni prozor info pult. Pred portalom su podest i dvije stube, a uz njih rampa s rukohvatima. Legenda povezuje oglasnu ploču s novostima i projektima, rampu s pristupačnošću, a pult s dokumentima. Oglasna ploča označena je toplim svjetlom.</desc>
