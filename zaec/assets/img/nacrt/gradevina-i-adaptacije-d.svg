<svg class="d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMaxYMid slice" role="img" aria-labelledby="nt05d nd05d"><title id="nt05d">Tlocrt stana s označenim rušenjem i novim zidovima, mjerilo 1:50</title><desc id="nd05d">Tehnički crtež adaptacije stana: postojeći zidovi puni, zidovi za rušenje isprekidani, novi zid šrafiran. Zid između boravka i kuhinje se ruši, a kupaonica se novim zidom širi u hodnik. Oznake 01–04 povezuju dijelove nacrta s dijelovima weba izvođača radova. Nova kupaonica označena je toplim svjetlom.</desc>
