<svg class="d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMaxYMid slice" role="img" aria-labelledby="nt03d nd03d"><title id="nt03d">Jednopolna shema kućnog razdjelnika s novim krugom punjača</title><desc id="nd03d">Tehnički crtež: priključak na mrežu preko brojila, glavna sklopka, zaštitna strujna sklopka i strujni krugovi kuće, fotonaponska elektrana s izmjenjivačem te novi strujni krug punjača za električni automobil. Oznake 01–04 povezuju dijelove sheme s dijelovima weba električara. Novi krug punjača označen je toplim svjetlom.</desc>
