<svg class="d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMaxYMid slice" role="img" aria-labelledby="ntU4d ndU4d"><title id="ntU4d">Rezultat pretrage za vodoinstalatera u Osijeku, uvećan kao detalj tehničkog crteža</title><desc id="ndU4d">Uvećan rezultat Google pretrage „hitni vodoinstalater“. Rezultati iznad i ispod nacrtani su samo kao kostur, a jedan je stvaran i osvijetljen: naziv obrta, adresa stranice, naslov, opis, ocjena i gumb Nazovi. Oznake povezuju naslov sa sadržajem, adresu sa strukturom i ocjenu sa schema podacima; toplo svjetlo je na gumbu Nazovi.</desc>
