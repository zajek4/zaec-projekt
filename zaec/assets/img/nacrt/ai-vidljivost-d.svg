<svg class="d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMaxYMid slice" role="img" aria-labelledby="ntU7d ndU7d"><title id="ntU7d">Odgovor AI asistenta koji spominje vaš obrt, s tri izvora</title><desc id="ndU7d">Razgovor s AI asistentom. Pitanje glasi: Curi bojler. Tko je dobar vodoinstalater u Osijeku? Odgovor je nacrtan kao kostur, a stvarna i osvijetljena je samo jedna rečenica: Vaš obrt — vodoinstalater u Osijeku. Rečenica je spojena s tri izvora nacrtana kao male kartice: web stranicom vasobrt.hr, kartom i recenzijama; naš web je osvijetljen. Toplo svjetlo je na nazivu obrta. Oznake povezuju pitanje s mjesečnom provjerom, web sa sadržajem i schemom, kartu s točnim podacima i recenzije s kontekstom.</desc>
