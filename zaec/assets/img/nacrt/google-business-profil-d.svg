<svg class="d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMaxYMid slice" role="img" aria-labelledby="ntU6d ndU6d"><title id="ntU6d">Kartica Google Business profila rastavljena na dijelove, nad kartom Tvrđe u Osijeku</title><desc id="ndU6d">Iznad je pruga stvarne karte Osijeka s Dravom i Tvrđom i oznakom obrta. Ispod nje je uvećana kartica profila rastavljena na dijelove kao sklop: zaglavlje, gumbi, podaci, fotografije i recenzije. Dijelovi su nacrtani kao kostur, a stvarni su i osvijetljeni samo naziv „Vaš obrt“, primarna kategorija Vodoinstalater i poveznica na stranicu weba za odčepljenje odvoda. Toplo svjetlo je na primarnoj kategoriji. Oznake povezuju kategoriju s postavljanjem profila, poveznicu s webom, fotografije sa stvarnim radovima i recenzije sa sustavom za recenzije.</desc>
