<svg class="d" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" preserveAspectRatio="xMaxYMid slice" role="img" aria-labelledby="ntU3d ndU3d"><title id="ntU3d">Oglas i landing stranica s istim naslovom i jednim gumbom</title><desc id="ndU3d">Lijevo je oglas nacrtan kao kostur s oznakom OGLAS i stvarnim naslovom „Servis klime prije ljeta”. Desno je jedna duga stranica: izbornik je uklonjen i nacrtan samo crtkano, na vrhu je isti naslov, a ispod njega jedini gumb, Zatražite termin, na kojem je toplo svjetlo. Znak jednakosti između dvaju naslova označava istu poruku. Ostatak stranice, tri razloga, dokaz i pitanja, nacrtan je samo kao kostur. Oznake povezuju isti naslov s obećanjem iz oglasa, uklonjeni izbornik s jednim gumbom, tri kartice s dijelom Zašto baš vi i citat s dokazom.</desc>
